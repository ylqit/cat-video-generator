content:
  timezone: Asia/Shanghai
  lifePackCandidatesPerDay: 3
  episodesPerDay: 3
  defaultDurationMs: 10000
  maxDurationMs: 15000
  maxPaidVideoAttemptsPerSlot: 2
  dialoguePolicy: no-character-dialogue
  continuity:
    defaultMode: shared_context
    requireFallbackForFollowsPrevious: true
    applyStateWritesAfterDelivery: true
  externalSignals:
    xiaohongshuMode: manual-approved-links
    persistRawComments: false
    persistPersonalData: false

execution:
  triggerMode: on_demand
  targetSelection: explicit_date_or_earliest_approved
  enforceWallClockWindow: false
  scheduler: external_optional
  paidGenerationRequiresCliAcknowledgement: true

media:
  image:
    provider: volcengine-ark
    baseUrl: https://ark.cn-beijing.volces.com/api/v3
    apiKeyEnv: ARK_API_KEY
    model: doubao-seedream-5-0-pro-260628
    size: 2K
    responseFormat: url
    outputFormat: png
    watermark: false
    timeoutMs: 120000

  video:
    provider: volcengine-ark
    baseUrl: https://ark.cn-beijing.volces.com/api/v3
    apiKeyEnv: ARK_API_KEY
    model: doubao-seedance-2-0-260128
    aspectRatio: "9:16"
    resolution: 720p
    defaultGenerationStrategy: single_pass
    defaultDurationSeconds: 10
    maxDurationSeconds: 15
    visualInputPolicy:
      selectionMode: explicit_risk_rules
      maxDirectReferenceImages: 9
      requireApprovedCanonReferences: true
      identityOrCompositionDriftRetryMode: generated_first_frame
      precedence:
        - generated_first_last_frames_when_exact_ending
        - generated_first_frame_when_other_visual_risk
        - direct_references_when_low_risk
    generateAudio: true
    audioMode: native
    allowDialogue: false
    allowNarration: false
    allowLyrics: false
    finalizationPolicy: validate_then_passthrough
    multiClipFallback:
      enabled: true
      maxClips: 3
    mediaTools:
      probeEveryOutput: true
      ffprobeRequired: true
      ffmpegFallbackEnabled: true
      ffmpegRequiredForPassthrough: false
      ffmpegPathEnv: FFMPEG_PATH
      ffprobePathEnv: FFPROBE_PATH
    watermark: false
    pollIntervalMs: 10000
    timeoutMs: 1800000

database:
  engine: postgresql
  schema: cat_video
  minimumMajorVersion: 14
  hostEnv: CAT_VIDEO_DB_HOST
  portEnv: CAT_VIDEO_DB_PORT
  nameEnv: CAT_VIDEO_DB_NAME
  userEnv: CAT_VIDEO_DB_USER
  passwordEnv: CAT_VIDEO_DB_PASSWORD
  sslModeEnv: CAT_VIDEO_DB_SSLMODE
  allowInsecureReadonlySmokeEnv: CAT_VIDEO_ALLOW_INSECURE_READONLY_SMOKE
  pool:
    size: 3
    maxOverflow: 2
    prePing: true
    recycleSeconds: 900
  timeouts:
    connectSeconds: 5
    statementMs: 30000
    lockMs: 5000
    idleInTransactionMs: 60000

storage:
  workRootEnv: MEDIA_WORK_ROOT
  assetRootEnv: MEDIA_ASSET_ROOT
  deliveryOutputRootEnv: DELIVERY_OUTPUT_ROOT
  hashAlgorithm: sha256
  atomicWrites: true
  requireCompleteThreeSlotDelivery: true
  downloadTemporaryProviderUrlsImmediately: true
